services:

  # Authentication Database
  db_auth:
    image: postgres:17
    container_name: db_auth
    environment:
      POSTGRES_DB: AuthenticationService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5434:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data

  # Patient Database
  db_patient:
    image: postgres:17
    container_name: db_patient
    environment:
      POSTGRES_DB: PatientService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5435:5432"
    volumes:
      - patient-data:/var/lib/postgresql/data

  # Analytics Database
  db_analytic:
    image: postgres:17
    container_name: db_analytic
    environment:
      POSTGRES_DB: AnalyticsService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5436:5432"
    volumes:
      - analytic-data:/var/lib/postgresql/data

  # Appointment Database
  db_appointment:
    image: postgres:17
    container_name: db_appointment
    environment:
      POSTGRES_DB: AppointmentService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5437:5432"
    volumes:
      - appointment-data:/var/lib/postgresql/data

  # Pharmacy Database
  db_pharmacy:
    image: postgres:17
    container_name: db_pharmacy
    environment:
      POSTGRES_DB: PharmacyService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5438:5432"
    volumes:
      - pharmacy-data:/var/lib/postgresql/data

  # Staff Database
  db_staff:
    image: postgres:17
    container_name: db_staff
    environment:
      POSTGRES_DB: StaffService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5439:5432"
    volumes:
      - staff-data:/var/lib/postgresql/data

  # Audit Logging Database
  db_audit:
    image: postgres:17
    container_name: db_audit
    environment:
      POSTGRES_DB: AuditLoggingService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5440:5432"
    volumes:
      - audit-data:/var/lib/postgresql/data

  # Billing & Claims Database
  db_billing:
    image: postgres:17
    container_name: db_billing
    environment:
      POSTGRES_DB: BillingClaimsService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5441:5432"
    volumes:
      - billing-data:/var/lib/postgresql/data

  # Inventory Database
  db_inventory:
    image: postgres:17
    container_name: db_inventory
    environment:
      POSTGRES_DB: InventoryService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5442:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data

  # Notification Database
  db_notification:
    image: postgres:17
    container_name: db_notification
    environment:
      POSTGRES_DB: NotificationService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alwis
    ports:
      - "5443:5432"
    volumes:
      - notification-data:/var/lib/postgresql/data

  # Zipkin Distributed Tracing
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Eureka Service Registry
  service-registry:
    build: ./ServiceRegistry
    image: service-registry:latest
    container_name: service-registry
    ports:
      - "8761:8761"

  # Authentication Service
  authentication-service:
    build: ./AuthenticationService
    image: authentication-service:latest
    container_name: authentication-service
    depends_on:
      - db_auth
      - service-registry
      - zipkin
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_auth:5432/AuthenticationService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Analytic Service
  analytics-service:
    build: ./AnalyticsService
    image: analytics-service:latest
    container_name: analytics-service
    depends_on:
      - db_analytic
      - authentication-service
      - service-registry
      - zipkin
    ports:
      - "9091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_analytic:5432/AnalyticsService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Appointment Service
  appointment-service:
    build: ./AppointmentService
    image: appointment-service:latest
    container_name: appointment-service
    depends_on:
      - authentication-service
      - db_appointment
      - service-registry
      - zipkin
    ports:
      - "9092:9092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_appointment:5432/AppointmentService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans


  # Audit Logging Service
  audit-logging-service:
    build: ./AuditLoggingService
    image: audit-logging-service:latest
    container_name: audit-logging-service
    depends_on:
      - authentication-service
      - db_audit
      - service-registry
      - zipkin
    ports:
      - "9093:9093"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_audit:5432/AuditLoggingService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Billing & Claims Service
  billing-claims-service:
    build: ./BillingClaimsService
    image: billing-claims-service:latest
    container_name: billing-claims-service
    depends_on:
      - authentication-service
      - db_billing
      - service-registry
      - zipkin
    ports:
      - "9094:9094"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_billing:5432/BillingClaimsService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Inventory Service
  inventory-service:
    build: ./InventoryService
    image: inventory-service:latest
    container_name: inventory-service
    depends_on:
      - authentication-service
      - db_inventory
      - service-registry
      - zipkin
    ports:
      - "9099:9099"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_inventory:5432/InventoryService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Notification Service
  notification-service:
    build: ./NotificationService
    image: notification-service:latest
    container_name: notification-service
    depends_on:
      - authentication-service
      - db_notification
      - service-registry
      - zipkin
    ports:
      - "9192:9192"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_notification:5432/NotificationService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Patient Service
  patient-service:
    build: ./PatientService
    image: patient-service:latest
    container_name: patient-service
    depends_on:
      - db_patient
      - authentication-service
      - service-registry
      - zipkin
    ports:
      - "9193:9193"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_patient:5432/PatientService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Pharmacy Service
  pharmacy-service:
    build: ./PharmacyService
    image: pharmacy-service:latest
    container_name: pharmacy-service
    depends_on:
      - authentication-service
      - db_pharmacy
      - service-registry
      - zipkin
    ports:
      - "9194:9194"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_pharmacy:5432/PharmacyService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Staff Service
  staff-service:
    build: ./StaffService
    image: staff-service:latest
    container_name: staff-service
    depends_on:
      - authentication-service
      - db_staff
      - service-registry
      - zipkin
    ports:
      - "9196:9196"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_staff:5432/StaffService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: alwis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  # Gateway Service
  gateway:
    build: ./Gateway
    image: gateway:latest
    container_name: gateway
    depends_on:
      - authentication-service
      - service-registry
      - zipkin
    ports:
      - "9090:9090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

volumes:
  auth-data:
  patient-data:
  analytic-data:
  appointment-data:
  pharmacy-data:
  staff-data:
  audit-data:
  billing-data:
  inventory-data:
  notification-data:
